plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.1.0'
group = 'com.example.cncd'

base {
    archivesName = 'create-no-cart-assembler-drill'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Если такой версии нет — возьми любую 21.1.x с https://projects.neoforged.net/neoforged/neoforge
    version = '21.1.172'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        create_no_cart_drill {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
